<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>香港隊乘法大戰</title>
    <style>
        :root { 
            --hk-red: #DA291C; 
            --hk-white: #FFFFFF;
            --pitch-green: #388E3C;
            --pitch-light: #4CAF50;
        }
        body { 
            font-family: "Microsoft JhengHei", sans-serif; 
            background-color: #222; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0; 
            padding: 0; 
            touch-action: manipulation; 
            height: 100vh;
            overflow: hidden;
        }
        
        /* Scoreboard */
        .scoreboard {
            background-color: #111;
            color: white;
            width: 100%;
            padding: 15px 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 3px solid var(--hk-red);
        }
        .team { display: flex; align-items: center; gap: 8px; }
        .score-box { background: #333; padding: 5px 15px; border-radius: 5px; font-size: 1.5rem; color: #FFD700; }

        /* The Soccer Pitch */
        .pitch {
            background: repeating-linear-gradient(0deg, var(--pitch-green), var(--pitch-green) 40px, var(--pitch-light) 40px, var(--pitch-light) 80px);
            width: 100%;
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 5px solid white;
        }
        .goal-net {
            width: 180px;
            height: 80px;
            border: 4px solid white;
            border-bottom: none;
            margin-top: 20px;
            background-image: 
                linear-gradient(45deg, rgba(255,255,255,0.4) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.4) 75%, rgba(255,255,255,0.4)), 
                linear-gradient(45deg, rgba(255,255,255,0.4) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.4) 75%, rgba(255,255,255,0.4));
            background-size: 10px 10px;
            background-position: 0 0, 5px 5px;
            position: relative;
        }
        .ball {
            font-size: 3rem;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
        }
        
        /* Ball Animations */
        .ball.shoot { transform: translate(-50%, -150px) scale(0.6); }
        .ball.miss { transform: translate(150px, -50px) scale(0.8) rotate(180deg); opacity: 0; }

        /* Math Problem Area */
        .problem-area {
            position: absolute;
            bottom: 90px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 15px;
            font-size: 2.5rem;
            font-weight: bold;
            color: #333;
            border: 3px solid var(--hk-red);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .input-display {
            color: var(--hk-red);
            min-width: 50px;
            text-align: center;
            border-bottom: 3px dashed var(--hk-red);
            height: 45px;
        }

        /* Message Overlay */
        #message {
            position: absolute;
            top: 40%;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 10;
        }
        .msg-goal { color: #00FF00; }
        .msg-miss { color: #FF3333; }

        /* Custom Number Pad */
        .numpad {
            background-color: #ececec;
            width: 100%;
            padding: 15px 10px;
            padding-bottom: 30px; /* Extra space for iPhone swipe bar */
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            box-sizing: border-box;
        }
        .num-btn {
            background-color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #333;
            padding: 15px 0;
            box-shadow: 0 4px #ccc;
            cursor: pointer;
            touch-action: manipulation; /* Prevents double-tap zooming */
        }
        .num-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 #ccc;
        }
        .action-btn { background-color: #555; color: white; box-shadow: 0 4px #333; }
        .action-btn:active { box-shadow: 0 0 #333; }
        .shoot-btn { background-color: var(--hk-red); color: white; box-shadow: 0 4px #901a12; grid-column: span 3; }
        .shoot-btn:active { box-shadow: 0 0 #901a12; }
    </style>
</head>
<body>

    <div class="scoreboard">
        <div class="team">🇭🇰 香港隊</div>
        <div class="score-box" id="score">0</div>
        <div class="team">連勝: <span id="streak" style="color:white; margin-left:5px;">0</span></div>
    </div>

    <div class="pitch">
        <div class="goal-net"></div>
        <div id="message"></div>
        <div class="ball" id="soccerBall">⚽</div>
        
        <div class="problem-area">
            <span id="n1">--</span> × <span id="n2">--</span> = <div class="input-display" id="userAnswer"></div>
        </div>
    </div>

    <div class="numpad">
        <button class="num-btn" onclick="pressNum(1)">1</button>
        <button class="num-btn" onclick="pressNum(2)">2</button>
        <button class="num-btn" onclick="pressNum(3)">3</button>
        <button class="num-btn" onclick="pressNum(4)">4</button>
        <button class="num-btn" onclick="pressNum(5)">5</button>
        <button class="num-btn" onclick="pressNum(6)">6</button>
        <button class="num-btn" onclick="pressNum(7)">7</button>
        <button class="num-btn" onclick="pressNum(8)">8</button>
        <button class="num-btn" onclick="pressNum(9)">9</button>
        <button class="num-btn action-btn" onclick="clearInput()">清除</button>
        <button class="num-btn" onclick="pressNum(0)">0</button>
        <button class="num-btn action-btn" onclick="deleteLast()">⌫</button>
        <button class="num-btn shoot-btn" onclick="shoot()">起腳射門！ 👟⚽</button>
    </div>

    <script>
        let score = 0;
        let streak = 0;
        let correctAnswer = 0;
        let currentInput = "";
        let isAnimating = false;

        function newProblem() {
            // Generate multipliers (focusing on 2 to 10 for standard times tables)
            let num1 = Math.floor(Math.random() * 9) + 2; 
            let num2 = Math.floor(Math.random() * 9) + 2;
            
            correctAnswer = num1 * num2;
            
            document.getElementById('n1').innerText = num1;
            document.getElementById('n2').innerText = num2;
            
            currentInput = "";
            updateDisplay();
            
            // Reset ball position
            const ball = document.getElementById('soccerBall');
            ball.className = "ball";
            document.getElementById('message').style.opacity = "0";
            isAnimating = false;
        }

        function pressNum(num) {
            if (isAnimating) return;
            // Prevent inputting more than 3 digits
            if (currentInput.length < 3) {
                currentInput += num.toString();
                updateDisplay();
            }
        }

        function clearInput() {
            if (isAnimating) return;
            currentInput = "";
            updateDisplay();
        }

        function deleteLast() {
            if (isAnimating) return;
            currentInput = currentInput.slice(0, -1);
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById('userAnswer').innerText = currentInput;
        }

        function shoot() {
            if (isAnimating || currentInput === "") return;
            isAnimating = true;
            
            const ball = document.getElementById('soccerBall');
            const msg = document.getElementById('message');
            
            if (parseInt(currentInput) === correctAnswer) {
                // Goal!
                score++;
                streak++;
                ball.classList.add('shoot');
                
                setTimeout(() => {
                    msg.innerText = "世界波！入咗！🇭🇰";
                    msg.className = "msg-goal";
                    msg.style.opacity = "1";
                    document.getElementById('score').innerText = score;
                    document.getElementById('streak').innerText = streak;
                }, 300);
                
                setTimeout(newProblem, 2000);
            } else {
                // Miss / Saved
                streak = 0;
                ball.classList.add('miss');
                
                setTimeout(() => {
                    msg.innerText = "被救出！再嚟過！🧤";
                    msg.className = "msg-miss";
                    msg.style.opacity = "1";
                    document.getElementById('streak').innerText = streak;
                    
                    // Clear input so he can try the same problem again
                    currentInput = "";
                    updateDisplay();
                }, 300);
                
                setTimeout(() => {
                    ball.className = "ball";
                    msg.style.opacity = "0";
                    isAnimating = false;
                }, 1500);
            }
        }

        // Start the first match
        newProblem();
    </script>
</body>
</html>
