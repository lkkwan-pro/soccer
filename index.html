<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>香港隊乘法大戰</title>
    <style>
        :root { 
            --hk-red: #DA291C; 
            --hk-white: #FFFFFF;
            --pitch-green: #388E3C;
            --pitch-light: #4CAF50;
            --gold: #FFD700;
        }
        * { box-sizing: border-box; }
        body { 
            font-family: "Microsoft JhengHei", sans-serif; 
            background-color: #222; 
            display: flex; 
            flex-direction: column; 
            margin: 0; 
            padding: 0; 
            height: 100dvh; 
            overflow: hidden;
            touch-action: manipulation; 
        }
        
        /* Scoreboard & Level Banner */
        .header-container { flex-shrink: 0; width: 100%; }
        .level-banner {
            background: linear-gradient(90deg, #FFD700, #FFA500);
            color: #000; text-align: center; padding: 6px; font-weight: bold;
            font-size: 1.1rem; border-bottom: 2px solid #333;
            transition: all 0.3s ease;
        }
        .scoreboard {
            background-color: #111; color: white; padding: 10px 0;
            display: flex; justify-content: space-around; align-items: center;
            font-size: 1.2rem; font-weight: bold; border-bottom: 3px solid var(--hk-red);
        }
        .team { display: flex; align-items: center; gap: 8px; }
        .score-box { background: #333; padding: 5px 15px; border-radius: 5px; font-size: 1.5rem; color: var(--gold); }

        /* The Soccer Pitch */
        .pitch {
            background: repeating-linear-gradient(0deg, var(--pitch-green), var(--pitch-green) 40px, var(--pitch-light) 40px, var(--pitch-light) 80px);
            width: 100%;
            flex-grow: 1; 
            min-height: 0;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 5px solid white;
        }
        
        /* 3D Goal Illusion */
        .goal-container {
            position: relative;
            width: 320px; 
            height: 120px;
            margin-top: 25px;
        }
        .goal-net-back {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(45deg, rgba(255,255,255,0.4) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.4) 75%, rgba(255,255,255,0.4)), 
                linear-gradient(45deg, rgba(255,255,255,0.4) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.4) 75%, rgba(255,255,255,0.4));
            background-size: 15px 15px;
            background-position: 0 0, 7.5px 7.5px;
            z-index: 1; 
        }
        .goal-posts {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            border: 8px solid white;
            border-bottom: none;
            z-index: 15; 
        }

        /* Stationary Goalkeeper */
        .goalie {
            font-size: 4.5rem;
            position: absolute;
            bottom: -15px; 
            left: 50%;
            margin-left: -2.25rem; 
            z-index: 12; 
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5));
        }

        /* The MASSIVE Ball */
        .ball {
            font-size: 9rem; 
            position: absolute;
            top: 55%; 
            left: 50%;
            margin-top: -4.5rem;
            margin-left: -4.5rem;
            transform: scale(1);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            filter: drop-shadow(0 8px 8px rgba(0,0,0,0.6));
            z-index: 10; 
            line-height: 1;
        }
        
        /* Ball Animations */
        .ball.shoot { 
            top: 60px; 
            transform: scale(0.25); 
            opacity: 0.9;
        }
        .ball.miss { 
            top: 60px;
            transform: translateX(140px) scale(0.3) rotate(180deg); 
            opacity: 0; 
        }

        /* The Timer Display */
        .timer-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 2.8rem; 
            font-weight: bold;
            z-index: 20;
            border: 3px solid white;
            transition: color 0.3s;
        }

        /* The New History Tracker */
        .history-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 1.6rem; /* Large enough for iPad readability */
            z-index: 20;
            border: 3px solid white;
            min-width: 140px;
        }
        .history-title {
            font-size: 1.2rem;
            color: var(--gold);
            text-align: center;
            border-bottom: 2px solid #555;
            padding-bottom: 5px;
            margin-bottom: 8px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-family: monospace;
            font-weight: bold;
            align-items: center;
            gap: 15px;
        }

        /* MASSIVE Math Problem Area */
        .problem-area {
            position: absolute;
            bottom: 3%;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 4.5rem; 
            font-weight: bold;
            color: #333;
            border: 4px solid var(--hk-red);
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 20; 
            white-space: nowrap;
        }
        .input-display {
            color: var(--hk-red); 
            min-width: 90px; 
            text-align: center;
            border-bottom: 5px dashed var(--hk-red); 
            height: 80px; 
            line-height: 80px;
        }

        /* Message Overlay */
        #message {
            position: absolute; top: 40%; font-size: 3.5rem; font-weight: bold;
            text-shadow: 2px 2px 0 #000; opacity: 0; transition: opacity 0.3s; z-index: 25;
            text-align: center; width: 100%;
        }
        .msg-goal { color: #00FF00; animation: scaleUp 0.5s ease; }
        .msg-miss { color: #FF3333; }
        @keyframes scaleUp { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }

        /* Fireworks Particles */
        .firework {
            position: absolute;
            z-index: 30;
            animation: burst 1s ease-out forwards;
            pointer-events: none;
        }
        @keyframes burst {
            0% { transform: scale(0.5) translateY(0); opacity: 1; }
            100% { transform: scale(1.5) translateY(-100px); opacity: 0; }
        }

        /* Custom Number Pad */
        .numpad {
            background-color: #ececec; width: 100%; flex-shrink: 0;
            padding: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom));
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
        }
        .num-btn {
            background-color: white; border: none; border-radius: 8px;
            font-size: 1.6rem; font-weight: bold; color: #333; padding: 12px 0;
            box-shadow: 0 4px #ccc; cursor: pointer; touch-action: manipulation;
        }
        .num-btn:active { transform: translateY(4px); box-shadow: 0 0 #ccc; }
        .action-btn { background-color: #555; color: white; box-shadow: 0 4px #333; font-size: 1.4rem;}
        .action-btn:active { box-shadow: 0 0 #333; }
        .shoot-btn { 
            background-color: var(--hk-red); color: white; box-shadow: 0 4px #901a12; 
            grid-column: span 3; padding: 15px 0; font-size: 1.6rem;
        }
        .shoot-btn:active { box-shadow: 0 0 #901a12; }
    </style>
</head>
<body>

    <div class="header-container">
        <div id="levelBanner" class="level-banner">級別 1: 小學學界正選 (0 分)</div>
        <div class="scoreboard">
            <div class="team">🇭🇰 香港隊</div>
            <div class="score-box" id="score">0</div>
            <div class="team">連勝: <span id="streak" style="color:white; margin-left:5px;">0</span></div>
        </div>
    </div>

    <div class="pitch">
        <div class="timer-badge" id="timerDisplay">⏱️ 0.0s</div>
        
        <!-- NEW: History Tracker Panel -->
        <div class="history-panel" id="historyPanel">
            <div class="history-title">最新5球</div>
            <div id="historyList">
                <div style="font-size: 1rem; color: #ccc; text-align: center; margin-top: 10px;">尚未起腳...</div>
            </div>
        </div>

        <div class="goal-container">
            <div class="goal-net-back"></div>
            <div class="goalie">🤾‍♂️</div>
            <div class="goal-posts"></div>
        </div>
        <div id="message"></div>
        <div class="ball" id="soccerBall">⚽</div>
        
        <div class="problem-area">
            <span id="n1">--</span> × <span id="n2">--</span> = <div class="input-display" id="userAnswer"></div>
        </div>
    </div>

    <div class="numpad">
        <button class="num-btn" onclick="pressNum(1)">1</button>
        <button class="num-btn" onclick="pressNum(2)">2</button>
        <button class="num-btn" onclick="pressNum(3)">3</button>
        <button class="num-btn" onclick="pressNum(4)">4</button>
        <button class="num-btn" onclick="pressNum(5)">5</button>
        <button class="num-btn" onclick="pressNum(6)">6</button>
        <button class="num-btn" onclick="pressNum(7)">7</button>
        <button class="num-btn" onclick="pressNum(8)">8</button>
        <button class="num-btn" onclick="pressNum(9)">9</button>
        <button class="num-btn action-btn" onclick="clearInput()">清除</button>
        <button class="num-btn" onclick="pressNum(0)">0</button>
        <button class="num-btn action-btn" onclick="deleteLast()">⌫</button>
        <button class="num-btn shoot-btn" onclick="shoot()">起腳射門！ 👟⚽</button>
    </div>

    <script>
        let score = 0;
        let streak = 0;
        let correctAnswer = 0;
        let currentInput = "";
        let isAnimating = false;
        let currentLevel = 1;
        
        let timerInterval;
        let timeElapsed = 0;
        
        // NEW: History Array
        let shootHistory = [];

        function updateLevelVisuals() {
            let newLevel = 1;
            let bannerText = `級別 1: 小學學界正選 (尚欠 ${30 - score} 分升級)`;

            if (score >= 150) {
                newLevel = 4; bannerText = "🏆 級別 4: 世界盃神射手! 🏆";
            } else if (score >= 80) {
                newLevel = 3; bannerText = `級別 3: 香港隊大國腳 (尚欠 ${150 - score} 分升級)`;
            } else if (score >= 30) {
                newLevel = 2; bannerText = `級別 2: 港超聯新星 (尚欠 ${80 - score} 分升級)`;
            }

            if (newLevel > currentLevel) {
                currentLevel = newLevel;
                document.getElementById('levelBanner').style.background = "linear-gradient(90deg, #00FF00, #32CD32)";
                setTimeout(() => {
                    document.getElementById('levelBanner').style.background = "linear-gradient(90deg, #FFD700, #FFA500)";
                }, 1500);
            }
            document.getElementById('levelBanner').innerText = bannerText;
        }

        // NEW: Function to update and render history
        function updateHistory(time, isGoal) {
            shootHistory.unshift({ time: time, isGoal: isGoal }); // Add to beginning
            if (shootHistory.length > 5) {
                shootHistory.pop(); // Keep only the latest 5
            }
            
            const listObj = document.getElementById('historyList');
            listObj.innerHTML = "";
            
            shootHistory.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                const icon = item.isGoal ? "🟢" : "❌";
                const color = item.isGoal ? "white" : "#FF3333";
                div.innerHTML = `<span style="color: ${color};">${item.time.toFixed(1)}s</span><span>${icon}</span>`;
                listObj.appendChild(div);
            });
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeElapsed = 0;
            const timerObj = document.getElementById('timerDisplay');
            timerObj.innerText = `⏱️ 0.0s`;
            timerObj.style.color = "white";
            
            timerInterval = setInterval(() => {
                timeElapsed += 0.1;
                timerObj.innerText = `⏱️ ${timeElapsed.toFixed(1)}s`;
                if (timeElapsed > 5.0) {
                    timerObj.style.color = "#FF3333";
                }
            }, 100);
        }

        function triggerFireworks() {
            const emojis = ['🎆', '✨', '🎉', '🔥'];
            const pitch = document.querySelector('.pitch');
            
            for (let i = 0; i < 20; i++) {
                let fw = document.createElement('div');
                fw.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                fw.className = 'firework';
                fw.style.left = (10 + Math.random() * 80) + '%';
                fw.style.top = (20 + Math.random() * 50) + '%';
                fw.style.fontSize = (2 + Math.random() * 3) + 'rem';
                
                pitch.appendChild(fw);
                setTimeout(() => fw.remove(), 1000);
            }
        }

        function newProblem() {
            let num1 = Math.floor(Math.random() * 8) + 2; 
            let num2 = Math.floor(Math.random() * 8) + 2;
            
            correctAnswer = num1 * num2;
            document.getElementById('n1').innerText = num1;
            document.getElementById('n2').innerText = num2;
            
            currentInput = "";
            updateDisplay();
            
            const ball = document.getElementById('soccerBall');
            ball.className = "ball";
            document.getElementById('message').style.opacity = "0";
            isAnimating = false;
            
            startTimer();
        }

        function pressNum(num) {
            if (isAnimating) return;
            if (currentInput.length < 3) {
                currentInput += num.toString();
                updateDisplay();
            }
        }

        function clearInput() {
            if (isAnimating) return;
            currentInput = "";
            updateDisplay();
        }

        function deleteLast() {
            if (isAnimating) return;
            currentInput = currentInput.slice(0, -1);
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById('userAnswer').innerText = currentInput;
        }

        function shoot() {
            if (isAnimating || currentInput === "") return;
            isAnimating = true;
            clearInterval(timerInterval); 
            
            const ball = document.getElementById('soccerBall');
            const msg = document.getElementById('message');
            
            if (parseInt(currentInput) === correctAnswer) {
                score += 10;
                streak++;
                
                // Record success history
                updateHistory(timeElapsed, true);
                
                ball.classList.add('shoot');
                updateLevelVisuals();
                
                if (timeElapsed <= 5.0) {
                    triggerFireworks();
                    setTimeout(() => {
                        msg.innerText = "神級反應！\n5秒入波！🎆";
                        msg.className = "msg-goal";
                        msg.style.opacity = "1";
                    }, 300);
                } else {
                    setTimeout(() => {
                        msg.innerText = "世界波！\n入咗！🇭🇰";
                        msg.className = "msg-goal";
                        msg.style.opacity = "1";
                    }, 300);
                }

                document.getElementById('score').innerText = score;
                document.getElementById('streak').innerText = streak;
                setTimeout(newProblem, 2000);
                
            } else {
                streak = 0;
                
                // Record fail history
                updateHistory(timeElapsed, false);
                
                ball.classList.add('miss');
                
                setTimeout(() => {
                    msg.innerText = "龍門救出！\n計過再射！🤾‍♂️";
                    msg.className = "msg-miss";
                    msg.style.opacity = "1";
                    document.getElementById('streak').innerText = streak;
                    currentInput = "";
                    updateDisplay();
                }, 300);
                
                setTimeout(() => {
                    ball.className = "ball";
                    msg.style.opacity = "0";
                    isAnimating = false;
                    startTimer(); 
                }, 1500);
            }
        }

        updateLevelVisuals();
        newProblem();
    </script>
</body>
</html>
